version: '3.8'

services:
  # Frontend Service (built locally)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend-local
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

