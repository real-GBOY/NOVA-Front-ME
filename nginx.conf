server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Gzip Compression (Optional: efficient if host nginx doesn't handle it)
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # 2. Main SPA Routing (The most critical part)
    location / {
        # First check if the file exists ($uri), then folder ($uri/), 
        # otherwise fallback to index.html so React Router handles the path.
        try_files $uri $uri/ /index.html;
    }

    # 3. Cache Static Assets (Vite outputs hashed filenames like index.a1b2.js)
    # Since filenames change with every build, we can cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # 4. Security: Hide Nginx version number in headers
    server_tokens off;

    # 5. Handle errors
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}